<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PDM | Login & Registration</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <!-- SCHOOL HEADER -->
        <header class="school-header">

            <div class="school-title">
                PAMBAYANG DALUBHASAAN
            </div>

            <div class="school-subtitle">
                NG MARILAO
            </div>

            <div class="school-line"></div>

            <p>
                PDM Online Student System
            </p>

        </header>


        <!-- LOGIN / REGISTER CARD -->
        <main class="auth-card">

            <div class="card-header">

                <h1>
                    Welcome Back
                </h1>

                <p>
                    Sign in to access your account
                </p>

            </div>


            <!-- LOGIN -->
            <section class="login-section">

                <h2>
                    Login
                </h2>

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                >


                <button
                    class="main-button"
                    onclick="login()"
                >
                    Login
                </button>

            </section>


            <div class="divider">

                <span>OR</span>

            </div>


            <!-- REGISTER -->
            <section class="register-section">

                <h2>
                    Create an Account
                </h2>

                <p class="register-text">
                    Don't have an account yet?
                    Register below.
                </p>


                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                >


                <button
                    class="register-button"
                    onclick="register()"
                >
                    Register
                </button>

            </section>


            <!-- MESSAGE -->
            <p id="message"></p>

        </main>


        <!-- FOOTER -->
        <footer>

            <p>
                <strong>Pambayang Dalubhasaan ng Marilao</strong>
            </p>

            <p>
                PDM Online Student System • 2026
            </p>

        </footer>

    </div>


    <script src="app.js"></script>

</body>

</html>
